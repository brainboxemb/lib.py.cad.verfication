name: CAD verification library

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: brainboxemb/tool.py.lib.ci/.github/workflows/reusable-ci.yml@9045367540102ba2208c517e45a52ddad4bb60ea
    with:
      python_version: "3.12"

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish declared release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py

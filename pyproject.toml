[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-verification-lib"
version = "0.1.0"
description = "Reusable Python library for CAD/model verification"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["cad_verification"]
